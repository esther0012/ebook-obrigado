<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Obrigado | Referência Capital (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g950:#0b1c13; --g900:#10271b; --g800:#1a3a2a; --gold:#c9a84c; --gold-hi:#ecd591; --gold-lo:#9c7f2e;
  --ivory:#f7f4ec; --mist:#b9c7bd;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --g800:#1a3a2a; } }
:root[data-theme="dark"]{ --g800:#1a3a2a; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; margin:0; padding:0; }
html,body{ background:var(--g800); }
body{
  min-height:100%; font-family:var(--sans); color:var(--ivory); line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; position:relative; isolation:isolate; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(700px 480px at 50% 28%, rgba(201,168,76,.18), transparent 65%),
    linear-gradient(180deg, var(--g800), #132c20);
}
.skyline{ position:fixed; left:0; right:0; bottom:0; width:100%; height:auto; z-index:-1; opacity:.16; pointer-events:none; }
main{ flex:1; display:flex; align-items:center; justify-content:center; padding:48px 22px; }
.box{ width:100%; max-width:560px; text-align:center; }
.logo{ width:30px; height:37px; color:var(--gold); margin:0 auto 34px; display:block; }
.check{
  width:84px; height:84px; margin:0 auto 26px; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 30% 25%, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); color:var(--g950);
  box-shadow:0 0 0 8px rgba(201,168,76,.14), 0 20px 40px -14px rgba(0,0,0,.6);
}
.check path{ stroke-dasharray:30; stroke-dashoffset:0; }
@media (prefers-reduced-motion: no-preference){
  .check{ animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both; }
  .check path{ animation:draw .5s ease-out .35s both; }
  @keyframes pop{ from{ transform:scale(.4); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes draw{ from{ stroke-dashoffset:30; } to{ stroke-dashoffset:0; } }
}
h1{
  font-family:var(--serif); font-weight:500; color:#fff;
  font-size:clamp(34px, 8vw, 54px); line-height:1.05; letter-spacing:-.022em; text-wrap:balance;
}
.lead{ margin-top:18px; font-size:clamp(17px, 2.6vw, 20px); color:#d6ded8; line-height:1.55; text-wrap:pretty; }
.lead strong{ color:#fff; font-weight:600; }
.watch{
  margin:30px auto 0; display:flex; align-items:center; gap:14px; text-align:left; max-width:440px;
  padding:16px 18px; border-radius:16px; background:rgba(11,28,19,.5); border:1px solid rgba(201,168,76,.3);
}
.watch-ico{ width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center; background:rgba(201,168,76,.14); color:var(--gold-hi); }
.watch p{ font-size:15px; color:var(--mist); line-height:1.45; }
.watch b{ display:block; color:#fff; font-size:15.5px; font-weight:600; margin-bottom:2px; }
footer{ padding:22px; text-align:center; font-size:12px; color:#8fa597; }
footer svg{ width:12px; height:15px; color:var(--gold); vertical-align:-2px; margin-right:6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="rc-logo" viewBox="355 260 795 975"><g fill="currentColor"><path fill-rule="evenodd" d="M365 270H790A298 298 0 0 1 805 866L1140 1218V1225H1030L365 525ZM448 353V492L725 784H790A215.5 215.5 0 0 0 790 353Z"/><path d="M370 627L930 1225H817L370 748Z"/></g><path d="M374 866L708 1220H609L374 968Z" fill="none" stroke="currentColor" stroke-width="10"/></symbol></svg>
<svg class="skyline" viewBox="0 0 1440 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true" fill="none" stroke="#c9a84c" stroke-width="1.2">
  <path d="M0 260V200h60v-40h50v100M110 260V120h70v140M180 260V170h40v-30h40v120M260 260V90h22V70h36v20h22v170M340 260V150h80v110M420 260V60l40-30 40 30v200M500 260V140h60v120M560 260V180h90v80M650 260V100h30V80h40v20h30v160M750 260V160h70v100M820 260V40h24V20h32v20h24v220M900 260V130h80v130M980 260V170h50v-40h40v130M1070 260V80l35-25 35 25v180M1140 260V150h70v110M1210 260V110h60v150M1270 260V190h70v70M1340 260V120h100v140"/>
</svg>

<main>
  <div class="box">
    <svg class="logo" aria-label="Referência Capital"><use href="#rc-logo"/></svg>
    <div class="check" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Um especialista vai entrar em contato com você em breve</h1>
    <p class="lead">Ele vai te explicar tudo com mais detalhes. <strong id="thanks">Obrigado pelo seu interesse!</strong></p>
    <div class="watch">
      <div class="watch-ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>
      </div>
      <p><b>Fique de olho no seu WhatsApp e no seu telefone.</b>O contato será feito logo mais.</p>
    </div>
  </div>
</main>

<footer><svg aria-hidden="true"><use href="#rc-logo"/></svg>Referência Capital</footer>

<script>
/* Personalização: a LP redireciona para esta página com ?nome=...&origem=... */
(function(){
  var p = new URLSearchParams(location.search);
  var nome = (p.get("nome") || "").trim().split(/\s+/)[0].replace(/[^A-Za-zÀ-ÿ'-]/g, "").slice(0, 30);
  if(nome.length >= 2){
    nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
    document.getElementById("thanks").textContent = "Obrigado pelo seu interesse, " + nome + "!";
  }
  try{
    (window.dataLayer = window.dataLayer || []).push({
      event: "pagina_obrigado",
      origem: p.get("origem") || "",
      lead_id: p.get("lead_id") || ""
    });
  }catch(e){}
})();
</script>
</body>
</html>
